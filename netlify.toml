[[redirects]]
  from = "/previa"
  to = "https://provador-cubic.netlify.app/dra-jennifer/"
  status = 302
  force = true

[[redirects]]
  from = "/previa/*"
  to = "https://provador-cubic.netlify.app/dra-jennifer/"
  status = 302
  force = true

[[redirects]]
  from = "/"
  to = "/a-selva-em-casa/"
  status = 302

[[headers]]
  for = "/*/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
