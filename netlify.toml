# Branch "previa": prévia do feed para aprovação (deploy de branch, sem custo de créditos).
[[redirects]]
  from = "/"
  to = "/previa/"
  status = 302

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/previa/posts.json"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/previa/index.html"
  [headers.values]
    Cache-Control = "no-cache"
